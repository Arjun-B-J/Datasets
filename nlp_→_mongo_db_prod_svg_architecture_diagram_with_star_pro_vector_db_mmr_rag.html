<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NLP → STAR Pro Architecture (PROD)</title>
<style>
  body { margin: 0; background:#f7f7f5; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; }
  svg { width: 100%; height: auto; }
  .box { fill: #ffffff; stroke: #2d2d2d; stroke-width: 1.6; rx: 10; }
  .title { font-weight: 700; font-size: 18px; }
  .subtitle { font-weight: 600; font-size: 14px; }
  .small { font-size: 12px; }
  .tiny { font-size: 11px; }
  .blue { stroke: #2865d8; }
  .teal { stroke: #129e92; }
  .orange { stroke: #d77a00; }
  .gray { stroke: #9aa3a8; }
  .dashed { stroke-dasharray: 6 6; }
  .arrow { stroke: #333; stroke-width: 1.6; marker-end: url(#arrowhead); fill: none; }
  .flownum { fill: #fff; stroke: #333; stroke-width: 1; rx: 5; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 2400" aria-label="NLP to MongoDB Prod Architecture with STAR Pro Agent, Vector DB and MMR-RAG">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="40" class="title">STAR Pro Architecture (PROD)</text>
  <!-- Column guides (not rendered) -->
  <!-- Left column x ~ 30..520; Middle 560..1060; Right 1100..1550 -->

  <!-- UI / Clients (Left Top) -->
  <rect class="box blue" x="30" y="100" width="470" height="140" />
  <text x="50" y="130" class="subtitle">User / Client UI</text>
  <text x="50" y="155" class="small">Web App • CLI • VS Code (PoC compatible)</text>
  <text x="50" y="180" class="tiny">Sends NL queries with: user_id, session_id, tenant, locale, pagination</text>
  <text x="50" y="200" class="tiny">Passes conversation refs for follow‑ups; secure auth tokens</text>

  <!-- API Gateway + Orchestrator (Middle Top) -->
  <rect class="box" x="560" y="90" width="520" height="180" />
  <text x="580" y="120" class="subtitle">API Gateway + Backend Orchestrator</text>
  <text x="580" y="145" class="tiny">LangGraph runtime: typed nodes, retries, timeouts, tracing</text>
  <text x="580" y="165" class="tiny">Routes to STAR Pro Agent, Governance, MCP tools; streams results</text>
  <text x="580" y="185" class="tiny">Applies tenant isolation and rate limits</text>

  <!-- Arrows UI -> Orchestrator -->
  <path class="arrow" d="M 500 170 L 560 170" />
  <rect class="flownum" x="520" y="150" width="24" height="26" />
  <text x="527" y="169" class="tiny">1</text>

  <!-- STAR Pro Agent container (Middle) -->
  <rect class="box" x="560" y="300" width="520" height="720" />
  <text x="580" y="330" class="subtitle">STAR Pro Agent (LangGraph)</text>
  <text x="580" y="352" class="tiny">Nodes a→g with tool‑use/JSON schemas; governed execution</text>

  <!-- a) Context Classifier -->
  <rect class="box orange" x="580" y="370" width="480" height="100" />
  <text x="600" y="395" class="small">a) User Context Classifier</text>
  <text x="600" y="415" class="tiny">Decides NEW vs FOLLOW_UP; detects domain/sensitivity; binds prior intent</text>
  <text x="600" y="435" class="tiny">Signals: embedding sim to prior intents, convo state, explicit cues, policy</text>
  <text x="600" y="455" class="tiny">Output: {query_type, prior_intent_ref, topic_cluster, sensitivity_level}</text>

  <!-- b) Adaptive Data Connector -->
  <rect class="box" x="580" y="480" width="480" height="90" />
  <text x="600" y="505" class="small">b) Adaptive Data Connector</text>
  <text x="600" y="525" class="tiny">Creates secure channel; short‑lived creds; readPref=secondary; caches indexes</text>

  <!-- c) Semantic Schema Extractor -->
  <rect class="box" x="580" y="580" width="480" height="110" />
  <text x="600" y="605" class="small">c) Semantic Schema Extractor</text>
  <text x="600" y="625" class="tiny">Pulls collections/fields/index stats; builds semantic model (entities/measures/dimensions)</text>
  <text x="600" y="645" class="tiny">Embeds fields & aliases; upserts into Vector DB; tags sensitive fields</text>

  <!-- d) Proto‑Query Contextual Intent Builder -->
  <rect class="box" x="580" y="700" width="480" height="100" />
  <text x="600" y="725" class="small">d) Proto‑Query Contextual Intent Builder</text>
  <text x="600" y="745" class="tiny">Uses RAG context to select candidate collections/joins, filters, projections</text>
  <text x="600" y="765" class="tiny">Produces proto‑MQL plan + constraints (limits, sort keys, index hints)</text>

  <!-- e) NLP->MQL Generator -->
  <rect class="box" x="580" y="810" width="480" height="90" />
  <text x="600" y="835" class="small">e) NLP → MQL Generator</text>
  <text x="600" y="855" class="tiny">Function‑calling to typed JSON; applies allow‑lists; auto LIMIT/pagination</text>

  <!-- g) Query Validation & Compliance -->
  <rect class="box orange" x="580" y="910" width="480" height="110" />
  <text x="600" y="935" class="small">g) Query Validation & Compliance (Safety Gate)</text>
  <text x="600" y="955" class="tiny">Parse & type checks; RBAC/tenant scopes; field/collection lists</text>
  <text x="600" y="975" class="tiny">Dry‑run explain(); reject COLLSCAN; cap cardinality; injection guard</text>

  <!-- f) Intelligent Query Execution Engine -->
  <rect class="box" x="580" y="1030" width="480" height="110" />
  <text x="600" y="1055" class="small">f) Intelligent Query Execution Engine</text>
  <text x="600" y="1075" class="tiny">Applies masking/RBAC views; executes with maxTimeMS, rate‑limits, retries</text>
  <text x="600" y="1095" class="tiny">Captures explain plan & metrics; guards against policy violations</text>

  <!-- LLM Layer (Right Top) -->
  <rect class="box" x="1100" y="100" width="470" height="150" />
  <text x="1120" y="130" class="subtitle">LLM Layer</text>
  <text x="1120" y="155" class="tiny">Hosted Claude via Tachyon (or equivalent) for planning, validation, summaries</text>
  <text x="1120" y="175" class="tiny">Tools: structured function calls to MCP/Mongo utilities</text>

  <!-- Vector Store (Right Mid) -->
  <rect class="box teal" x="1100" y="270" width="470" height="180" />
  <text x="1120" y="300" class="subtitle">Vector DB + MMR‑RAG Retrieval</text>
  <text x="1120" y="325" class="tiny">Maximum Marginal Relevance (MMR) balances relevance vs diversity</text>
  <text x="1120" y="345" class="tiny">Indexes: semantic schema embeddings, glossary/policies, approved MQL snippets, convo summaries</text>
  <text x="1120" y="365" class="tiny">Params: k (pool), k_final (return), λ (0..1). Used in nodes c/d/e.</text>

  <!-- MongoDB (Right Lower) -->
  <rect class="box" x="1100" y="470" width="470" height="170" />
  <text x="1120" y="500" class="subtitle">MongoDB (Read‑only)</text>
  <text x="1120" y="525" class="tiny">Replica/role for prod; readPreference=secondary; explain() access</text>
  <text x="1120" y="545" class="tiny">Indexed collections required; results returned to Governance</text>

  <!-- Governance Layer (Left Mid) -->
  <rect class="box teal" x="30" y="260" width="470" height="160" />
  <text x="50" y="290" class="subtitle">Data Governance / Masking</text>
  <text x="50" y="315" class="tiny">Sensitive‑field masking (PII/PCI/PHI); column suppression/tokenization</text>
  <text x="50" y="335" class="tiny">Role‑based views (RBAC/ABAC), tenant boundaries, policy enforcement</text>
  <text x="50" y="355" class="tiny">Applied at validation and at result egress</text>

  <!-- Audit & Logging (Left Lower) -->
  <rect class="box orange" x="30" y="440" width="470" height="210" />
  <text x="50" y="470" class="subtitle">Audit & Logging</text>
  <text x="50" y="495" class="tiny">Tamper‑evident logs (hash chain) shipped to SIEM</text>
  <text x="50" y="515" class="tiny">Record: timestamp, user_id, session_id, tenant, raw_prompt, query_type</text>
  <text x="50" y="535" class="tiny">retrieved_context_refs, proto_plan, final_MQL, validation_report_id</text>
  <text x="50" y="555" class="tiny">explain_summary, row_count, latency_ms, decision_flags, errors</text>

  <!-- Monitoring & Alerts -->
  <rect class="box blue" x="30" y="670" width="470" height="180" />
  <text x="50" y="700" class="subtitle">Monitoring & Alerts</text>
  <text x="50" y="725" class="tiny">SLOs (p95 latency, timeout rate); plan‑drift; anomaly detection</text>
  <text x="50" y="745" class="tiny">MMR recall/diversity metrics; index suggestions; quota/rate alarms</text>

  <!-- MCP Functions / Tools -->
  <rect class="box gray" x="30" y="870" width="470" height="170" />
  <text x="50" y="900" class="subtitle">MCP / Agent Functions (examples)</text>
  <text x="50" y="925" class="tiny">connect_to_mongodb() • get_database_schema() • get_context_info()</text>
  <text x="50" y="945" class="tiny">execute_mongodb_query() — executes pre‑approved, validated queries</text>

  <!-- Result Egress to UI -->
  <rect class="box blue" x="30" y="1060" width="470" height="140" />
  <text x="50" y="1090" class="subtitle">Results → Governance → UI</text>
  <text x="50" y="1115" class="tiny">Paginated streaming; summaries post‑processed by LLM (no data widening)</text>
  <text x="50" y="1135" class="tiny">Safe‑share links; export with masks; lineage to audit records</text>

  <!-- Arrows amongst components -->
  <!-- Orchestrator -> STAR Pro Agent -->
  <path class="arrow" d="M 820 270 L 820 300" />
  <rect class="flownum" x="800" y="275" width="24" height="26" /><text x="807" y="294" class="tiny">2</text>

  <!-- Agent ↔ LLM -->
  <path class="arrow" d="M 1080 360 L 1100 360" />
  <path class="arrow" d="M 1100 200 L 1080 200" />

  <!-- Agent ↔ Vector DB -->
  <path class="arrow" d="M 1080 450 L 1100 450" />

  <!-- Agent (f) -> MongoDB -->
  <path class="arrow" d="M 1060 1085 L 1100 1085 L 1100 555" />

  <!-- Validation (g) dry‑run explain to MongoDB -->
  <path class="arrow dashed" d="M 1060 965 L 1100 965 L 1100 555" />

  <!-- Governance ↔ Agent -->
  <path class="arrow" d="M 500 340 L 560 340" />

  <!-- Audit/Logging from many nodes (fan‑out arrows) -->
  <path class="arrow" d="M 560 430 L 500 520" />
  <path class="arrow" d="M 560 530 L 500 530" />
  <path class="arrow" d="M 560 635 L 500 540" />
  <path class="arrow" d="M 560 750 L 500 560" />
  <path class="arrow" d="M 560 845 L 500 580" />
  <path class="arrow" d="M 560 955 L 500 600" />
  <path class="arrow" d="M 560 1085 L 500 620" />

  <!-- Monitoring taps -->
  <path class="arrow" d="M 560 1080 L 500 740" />
  <path class="arrow" d="M 1100 555 L 500 760" />

  <!-- Results to UI -->
  <path class="arrow" d="M 560 1120 L 500 1130" />
  <path class="arrow" d="M 560 1120 L 500 350" />

  <!-- Legend -->
  <rect class="box" x="1100" y="660" width="470" height="150" />
  <text x="1120" y="690" class="subtitle">Legend & Notes</text>
  <text x="1120" y="715" class="tiny">Orange = Validation / Safety • Teal = Governance / Masking • Blue = Client / Monitoring</text>
  <text x="1120" y="735" class="tiny">MMR‑RAG: MMR selects diverse yet relevant docs (λ controls diversity)</text>
  <text x="1120" y="755" class="tiny">All DB access is read‑only; heavy ops require materialized views</text>

  <!-- Flow steps (rightmost) -->
  <rect class="box" x="1100" y="830" width="470" height="460" />
  <text x="1120" y="860" class="subtitle">End‑to‑End Flow</text>
  <text x="1120" y="885" class="tiny">1) Ingest NL query (UI)</text>
  <text x="1120" y="905" class="tiny">2) Orchestrate graph (LangGraph)</text>
  <text x="1120" y="925" class="tiny">3) Classify NEW vs FOLLOW_UP; scope and sensitivity</text>
  <text x="1120" y="945" class="tiny">4) Connect to data (read‑only, secondary)</text>
  <text x="1120" y="965" class="tiny">5) Extract semantic schema; embed to Vector DB</text>
  <text x="1120" y="985" class="tiny">6) Retrieve with MMR‑RAG for schema, policies, examples</text>
  <text x="1120" y="1005" class="tiny">7) Build proto‑intent (collections, filters, projections)</text>
  <text x="1120" y="1025" class="tiny">8) Generate MQL (typed, limited, masked)</text>
  <text x="1120" y="1045" class="tiny">9) Validate & Compliance (explain cost, injection guard)</text>
  <text x="1120" y="1065" class="tiny">10) Execute intelligently (limits, retries, capture explain)</text>
  <text x="1120" y="1085" class="tiny">11) Results → Governance masking → UI stream</text>
  <text x="1120" y="1105" class="tiny">12) Audit + Monitoring fan‑out (SIEM, SLO, drift, anomalies)</text>

</svg>
</body>
</html>
